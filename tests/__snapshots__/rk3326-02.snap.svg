"196.86460807600952" fill="rgba(71, 85, 105, 0.18)" stroke="#475569" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="17" data-y="-4" x="438.3847980997625" y="300.71258907363415" width="106.4133016627078" height="106.41330166270785" fill="rgba(71, 85, 105, 0.18)" stroke="#475569" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="-20" x="232.20902612826603" y="533.4916864608076" width="66.50831353919239" height="66.50831353919239" fill="rgba(71, 85, 105, 0.18)" stroke="#475569" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="15.5" x="169.02612826603325" y="64.6080760095011" width="192.87410926365794" height="59.85748218527317" fill="rgba(71, 85, 105, 0.18)" stroke="#475569" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="7.65" data-y="-0.165" x="366.2232779097387" y="301.9097387173396" width="1.9952494061757875" height="1.9952494061757875" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="16.749937" data-y="-10" x="487.2675705463183" y="432.7315914489311" width="1.9952494061757307" height="1.9952494061757307" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="7.65" data-y="0" x="366.2232779097387" y="299.7149643705463" width="1.9952494061757875" height="1.9952494061757307" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="16.500001" data-y="-10" x="483.943006175772" y="432.7315914489311" width="1.9952494061757875" height="1.9952494061757307" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="7.65" data-y="3.25" x="366.2232779097387" y="256.4845605700712" width="1.9952494061757875" height="1.9952494061757875" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="17" data-y="-10" x="490.59382422802855" y="432.7315914489311" width="1.9952494061757307" height="1.9952494061757307" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><text data-type="text" data-label="3 routed traces" data-x="-7.4" data-y="19" x="167.03087885985747" y="47.98099762470301" fill="#0f172a" font-size="15.961995249406177" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">3 routed traces</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":13.301662707838481,"c":0,"e":265.4631828978622,"b":0,"d":-13.301662707838481,"f":300.71258907363415};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
