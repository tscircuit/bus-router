4)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="0.4125" data-y="12.45008665" x="272.34679334916865" y="134.10811106888355" width="1.9952494061757875" height="1.995249406175759" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="2.6" data-y="7.65" x="301.4441805225653" y="197.95724465558186" width="1.9952494061757875" height="1.9952494061757875" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="1.249807" data-y="12.45008665" x="283.4843686460808" y="134.10811106888355" width="1.9952494061757875" height="1.995249406175759" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="2.275" data-y="7.65" x="297.12114014251785" y="197.95724465558186" width="1.9952494061757875" height="1.9952494061757875" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><g><rect data-type="rect" data-label="" data-x="1.749933" data-y="12.45008665" x="290.1368760095012" y="134.10811106888355" width="1.9952494061757875" height="1.995249406175759" fill="rgba(37, 99, 235, 0.24)" stroke="#2563eb" stroke-width="0.07517857142857141"/></g><text data-type="text" data-label="10 routed traces" data-x="-7.4" data-y="19" x="169.4251781472684" y="47.98099762470301" fill="#0f172a" font-size="15.961995249406177" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">10 routed traces</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":13.301662707838481,"c":0,"e":267.85748218527317,"b":0,"d":-13.301662707838481,"f":300.71258907363415};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
